[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://linkora-backend-av48.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/r/*"
  to = "https://linkora-backend-av48.onrender.com/r/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
